<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAXPBJ - Portal Utama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .brand-block{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .brand-main{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1;
    }

    .sidebar-toggle-btn{
      width:38px;
      height:38px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,0.14);
      color:#fff;
      cursor:pointer;
      font-size:18px;
      font-weight:700;
      flex:0 0 38px;
      transition:all 0.2s ease;
    }

    .sidebar-toggle-btn:hover{
      background:rgba(255,255,255,0.22);
    }

    .content-area.content-area--bare{
      padding:22px;
    }

    .content-area.content-area--bare.module-mode{
      padding:14px 18px 24px 18px;
    }

    .portal-page-heading{
      background:#fff;
      border:1px solid #dbe5f0;
      border-radius:20px;
      padding:18px 22px;
      margin-bottom:18px;
      box-shadow:0 12px 28px rgba(15,23,42,0.06);
    }

    .portal-page-heading h2{
      margin:0 0 6px 0;
      font-size:22px;
      line-height:1.2;
      color:#10233b;
    }

    .portal-page-heading p{
      margin:0;
      font-size:13px;
      line-height:1.6;
      color:#64748b;
    }

    .sidebar.sidebar--collapsed{
      width:92px !important;
    }

    .sidebar.sidebar--collapsed .brand-text,
    .sidebar.sidebar--collapsed .nav-section-label,
    .sidebar.sidebar--collapsed .nav-text,
    .sidebar.sidebar--collapsed .nav-caret,
    .sidebar.sidebar--collapsed .submenu,
    .sidebar.sidebar--collapsed .sidebar-help{
      display:none !important;
    }

    .sidebar.sidebar--collapsed .brand-block{
      justify-content:center;
    }

    .sidebar.sidebar--collapsed .nav-link{
      justify-content:center;
      padding-left:0;
      padding-right:0;
    }

    .sidebar.sidebar--collapsed .nav-left{
      justify-content:center;
      width:100%;
    }

    .sidebar.sidebar--collapsed .nav-icon{
      margin-right:0;
    }

    @media (max-width:980px){
      .content-area.content-area--bare{
        padding:16px;
      }

      .content-area.content-area--bare.module-mode{
        padding:10px 12px 18px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-main">
          <div class="brand-logo">TP</div>
          <div class="brand-text">
            <h1>TRAXPBJ</h1>
            <p>Simulasi &amp; Monitoring PBJ</p>
          </div>
        </div>
        <button class="sidebar-toggle-btn" id="sidebarToggleButton" type="button" aria-label="Minimize sidebar">☰</button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">MENU UTAMA</div>

        <button class="nav-link active" data-page="dashboard">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Dashboard</span>
        </button>

        <div class="nav-group open" data-group="monitoring">
          <button class="nav-link nav-toggle" data-toggle-group="monitoring">
            <span class="nav-left">
              <span class="nav-icon">📊</span>
              <span class="nav-text">Monitoring</span>
            </span>
            <span class="nav-caret">⌄</span>
          </button>
          <div class="submenu">
            <button class="submenu-link" data-page="monitoring-perencanaan">Monitoring Perencanaan</button>
            <button class="submenu-link" data-page="monitoring-konsolidasi">Monitoring Paket Konsolidasi</button>
            <button class="submenu-link" data-page="monitoring-sirup">SiRUP</button>
            <button class="submenu-link" data-page="monitoring-ekatalog">eKatalog</button>
            <button class="submenu-link" data-page="monitoring-etendering">eTendering</button>
            <button class="submenu-link" data-page="monitoring-nontender">Non Tender</button>
            <button class="submenu-link" data-page="monitoring-ekontrak">eKontrak</button>
          </div>
        </div>

        <button class="nav-link" data-page="rapor-pbj">
          <span class="nav-icon">📝</span>
          <span class="nav-text">Rapor PBJ</span>
        </button>

        <div class="nav-group" data-group="simulasi">
          <button class="nav-link nav-toggle" data-toggle-group="simulasi">
            <span class="nav-left">
              <span class="nav-icon">🧪</span>
              <span class="nav-text">Simulasi</span>
            </span>
            <span class="nav-caret">⌄</span>
          </button>
          <div class="submenu">
            <button class="submenu-link" data-page="simulasi-timeline">Timeline Pengadaan</button>
            <button class="submenu-link" data-page="simulasi-nontender">Pencatatan Non Tender</button>
          </div>
        </div>
      </nav>

      <div class="sidebar-help">
        <h3>Butuh Bantuan?</h3>
        <p>Hubungi admin/helpdesk untuk informasi penggunaan portal TRAXPBJ.</p>
        <button class="help-button" type="button">Hubungi Helpdesk</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <main class="content-area content-area--bare" id="contentArea"></main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
