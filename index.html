<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123a72">
  <meta name="description" content="Widget OPD Dipantau SIPPBJ Kota Bogor">
  <title>Widget OPD Dipantau</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <section class="widget-card" id="widgetCard">
      <header class="widget-head" id="dragHandle">
        <div>
          <div class="eyebrow">OPD Dipantau</div>
          <h1 id="selectedOpdTitle">PEMERINTAH KOTA BOGOR</h1>
          <span class="pill">Widget OPD Dipantau</span>
        </div>
        <button class="icon-btn" id="btnCloseTop" type="button" title="Tutup">×</button>
      </header>

      <section class="hero-mini">
        <div class="score-ring" id="scoreRing" style="--pct:0%">
          <div class="ring-inner">
            <small>ITKP OPD</small>
            <strong id="scoreValue">0,00</strong>
            <span>dari 30 poin</span>
          </div>
        </div>
        <div class="hero-copy">
          <strong id="heroOpdName">Pilih OPD</strong>
          <p id="heroDesc">Pilih OPD untuk memantau skor ITKP, rapor terbaru, dan pencarian penyedia.</p>
          <button class="small-btn" id="btnNotify" type="button">Aktifkan Notifikasi</button>
        </div>
      </section>

      <nav class="tabs" aria-label="Menu widget">
        <button class="tab active" data-tab="opd" type="button">Cari / Ganti OPD</button>
        <button class="tab" data-tab="search" type="button">🔎 Cari Penyedia</button>
        <button class="tab" data-tab="itkp" type="button">Ringkasan ITKP</button>
        <button class="tab" data-tab="rapor" type="button">Info Rapor</button>
      </nav>

      <section class="panel active" id="panel-opd">
        <label class="field-label" for="opdSearch">Pilih OPD</label>
        <input id="opdSearch" class="input" type="search" placeholder="Cari OPD...">
        <div class="opd-list" id="opdList"></div>
      </section>

      <section class="panel" id="panel-search">
        <div class="search-box">
          <label class="field-label" for="providerKeyword">Pencarian Penyedia Pengadaan SPSE</label>
          <div class="search-row">
            <input id="providerKeyword" class="input" type="search" placeholder="Ketik minimal 2 karakter...">
            <button id="btnProviderSearch" class="primary-btn" type="button">Cari</button>
          </div>
          <div class="hint" id="providerHint">Ketik minimal 2 karakter lalu tekan Cari.</div>
        </div>
        <div class="provider-results" id="providerResults"></div>
      </section>

      <section class="panel" id="panel-itkp">
        <div class="section-head">
          <h2>Ringkasan ITKP</h2>
          <button id="btnMinimizeItkp" class="ghost-btn" type="button">Minimize</button>
        </div>
        <div id="itkpSummary"></div>
      </section>

      <section class="panel" id="panel-rapor">
        <div class="section-head"><h2>Info Rapor Terbaru</h2></div>
        <div id="raporInfo" class="info-card">Memuat info rapor...</div>
      </section>

      <footer class="widget-foot">
        <button id="btnInstall" class="ghost-btn" type="button" hidden>Install Widget</button>
        <button id="btnRefresh" class="ghost-btn" type="button">Refresh Data</button>
        <button id="btnCloseBottom" class="ghost-btn" type="button">Tutup</button>
      </footer>
    </section>

    <button class="mini-pin hidden" id="miniPin" type="button" title="Buka widget">
      <span class="mini-score" id="miniScore">0,00</span>
      <span><small>OPD Dipantau</small><b id="miniOpd">PEMERINTAH KOTA BOGOR</b></span>
    </button>
  </main>
  <script src="./app.js"></script>
  <script src="./pwa-register.js"></script>
</body>
</html>
