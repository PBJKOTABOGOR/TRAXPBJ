<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAXPBJ - Portal Utama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .brand-block{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand-inner{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1;
    }
    .sidebar-toggle-btn{
      width:36px;
      height:36px;
      border:none;
      border-radius:10px;
      background:rgba(255,255,255,0.16);
      color:#fff;
      cursor:pointer;
      flex-shrink:0;
      font-size:18px;
      line-height:1;
    }
    .sidebar-toggle-btn:hover{
      background:rgba(255,255,255,0.24);
    }
    body.sidebar-collapsed .sidebar{
      width:88px !important;
      min-width:88px !important;
    }
    body.sidebar-collapsed .brand-text,
    body.sidebar-collapsed .nav-section-label,
    body.sidebar-collapsed .nav-text,
    body.sidebar-collapsed .nav-caret,
    body.sidebar-collapsed .submenu,
    body.sidebar-collapsed .sidebar-help h3,
    body.sidebar-collapsed .sidebar-help p,
    body.sidebar-collapsed .help-button{
      display:none !important;
    }
    body.sidebar-collapsed .brand-block{
      justify-content:center;
    }
    body.sidebar-collapsed .brand-inner{
      justify-content:center;
      flex:none;
    }
    body.sidebar-collapsed .sidebar-toggle-btn{
      position:absolute;
      top:18px;
      right:10px;
      width:28px;
      height:28px;
      font-size:15px;
      border-radius:8px;
    }
    body.sidebar-collapsed .nav-link{
      justify-content:center !important;
      padding-left:0 !important;
      padding-right:0 !important;
    }
    body.sidebar-collapsed .nav-left{
      justify-content:center !important;
      width:100%;
    }
    body.sidebar-collapsed .nav-icon{
      margin:0 !important;
    }
    .main-wrapper{
      min-width:0;
      flex:1;
    }
    .content-area{
      padding:16px;
    }
    .content-area.module-mode{
      padding:10px 12px 12px 0 !important;
    }
    .module-page,
    .module-page--timeline{
      width:100%;
      margin:0;
      padding:0;
    }
    .module-page--timeline .timeline-module,
    .module-page--timeline .app,
    .module-page--timeline .main,
    .module-page--timeline .content{
      width:100%;
      max-width:none;
      margin:0;
    }
    .module-page--timeline .main{
      padding:0;
    }
    .module-page--timeline .content{
      padding:0 0 0 10px !important;
    }
    @media (max-width:980px){
      .content-area,
      .content-area.module-mode{
        padding:12px !important;
      }
      .module-page--timeline .content{
        padding:0 !important;
      }
    }
  </style>

</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-inner">
          <div class="brand-logo">TP</div>
          <div class="brand-text">
            <h1>TRAXPBJ</h1>
            <p>Simulasi &amp; Monitoring PBJ</p>
          </div>
        </div>
        <button class="sidebar-toggle-btn" id="menuButton" aria-label="Toggle sidebar">☰</button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">MENU UTAMA</div>

        <button class="nav-link active" data-page="dashboard">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Dashboard</span>
        </button>

        <div class="nav-group open" data-group="monitoring">
          <button class="nav-link nav-toggle" data-toggle-group="monitoring">
            <span class="nav-left">
              <span class="nav-icon">📊</span>
              <span class="nav-text">Monitoring</span>
            </span>
            <span class="nav-caret">⌄</span>
          </button>
          <div class="submenu">
            <button class="submenu-link" data-page="monitoring-perencanaan">Monitoring Perencanaan</button>
            <button class="submenu-link" data-page="monitoring-konsolidasi">Monitoring Paket Konsolidasi</button>
            <button class="submenu-link" data-page="monitoring-sirup">SiRUP</button>
            <button class="submenu-link" data-page="monitoring-ekatalog">eKatalog</button>
            <button class="submenu-link" data-page="monitoring-etendering">eTendering</button>
            <button class="submenu-link" data-page="monitoring-nontender">Non Tender</button>
            <button class="submenu-link" data-page="monitoring-ekontrak">eKontrak</button>
          </div>
        </div>

        <button class="nav-link" data-page="rapor-pbj">
          <span class="nav-icon">📝</span>
          <span class="nav-text">Rapor PBJ</span>
        </button>

        <div class="nav-group" data-group="simulasi">
          <button class="nav-link nav-toggle" data-toggle-group="simulasi">
            <span class="nav-left">
              <span class="nav-icon">🧪</span>
              <span class="nav-text">Simulasi</span>
            </span>
            <span class="nav-caret">⌄</span>
          </button>
          <div class="submenu">
            <button class="submenu-link" data-page="simulasi-timeline">Timeline Pengadaan</button>
            <button class="submenu-link" data-page="simulasi-nontender">Pencatatan Non Tender</button>
          </div>
        </div>
      </nav>

      <div class="sidebar-help">
        <h3>Butuh Bantuan?</h3>
        <p>Hubungi admin/helpdesk untuk informasi penggunaan portal TRAXPBJ.</p>
        <button class="help-button" type="button">Hubungi Helpdesk</button>
      </div>
    </aside>

    <div class="main-wrapper">

<main class="content-area" id="contentArea"></main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
