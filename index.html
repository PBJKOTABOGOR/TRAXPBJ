<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
  window.PBJ_PIN_INDEX_RAPOT_ROWS = window.PBJ_PIN_INDEX_RAPOT_ROWS || [];
  window.PBJ_PIN_CONFIG = {
    defaultOpd: 'PEMERINTAH KOTA BOGOR',
    scoreMax: 30,
    refreshMs: 60000,
    dataProvider: function(){
      const data = window.PBJ_DASHBOARD_DATA || {};
      const profiles = Array.isArray(data.itkpProfiles) ? data.itkpProfiles : [];
      const opdRows = profiles.map(function(profile){
        function dim(name){
          const list = Array.isArray(profile.dimensions) ? profile.dimensions : [];
          const found = list.find(function(item){ return String(item.name || '').toLowerCase() === String(name || '').toLowerCase(); });
          return found ? Number(found.value || 0) : 0;
        }
        return {
          nama_opd: profile.name || '',
          kode_opd: profile.kode || '',
          nilai_itkp: profile.score || 0,
          sirup_score: dim('SiRUP'),
          toko_daring_score: dim('Toko Daring'),
          epurchasing_score: dim('e-Purchasing'),
          etendering_score: dim('e-Tendering'),
          ekontrak_score: dim('e-Kontrak'),
          non_etendering_score: dim('Non eTendering / Non ePurchasing')
        };
      });
      return {
        opdRows: opdRows,
        raporRows: window.PBJ_PIN_INDEX_RAPOT_ROWS || []
      };
    }
  };

  (function(){
    const SHEET_ID = '1ccDgtXNATxSYMZuDgd3polvRiTFNiFnjIGMP7b9qmrU';
    const SHEET_NAME = 'INDEX_RAPOT';
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(SHEET_NAME);

    function parseCsv(text){
      const rows = [];
      let row = [], value = '', quote = false;
      for (let i = 0; i < text.length; i++){
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && quote && next === '"') { value += '"'; i++; continue; }
        if (ch === '"') { quote = !quote; continue; }
        if (ch === ',' && !quote) { row.push(value); value = ''; continue; }
        if ((ch === '\n' || ch === '\r') && !quote) {
          if (ch === '\r' && next === '\n') i++;
          row.push(value);
          if (row.some(function(c){ return String(c).trim() !== ''; })) rows.push(row);
          row = []; value = '';
          continue;
        }
        value += ch;
      }
      row.push(value);
      if (row.some(function(c){ return String(c).trim() !== ''; })) rows.push(row);
      return rows;
    }

    function loadIndexRapot(){
      fetch(CSV_URL + '&v=' + Date.now(), { cache:'no-store' })
        .then(function(res){ return res.ok ? res.text() : ''; })
        .then(function(text){
          if (!text || /<html|DOCTYPE html|googlevisualization/i.test(text.slice(0,300))) return;
          const matrix = parseCsv(text);
          const headers = matrix.shift() || [];
          window.PBJ_PIN_INDEX_RAPOT_ROWS = matrix.map(function(cells){
            const row = {};
            headers.forEach(function(header, i){ row[String(header || '').trim()] = String(cells[i] || '').trim(); });
            return row;
          }).filter(function(row){ return Object.values(row).some(function(v){ return String(v).trim() !== ''; }); });
          if (window.PBJ_PIN_WIDGET && typeof window.PBJ_PIN_WIDGET.refresh === 'function') window.PBJ_PIN_WIDGET.refresh();
        })
        .catch(function(){});
    }

    loadIndexRapot();
    setInterval(loadIndexRapot, 60000);
  })();
</script>
